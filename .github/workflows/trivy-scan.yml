name: Trivy dependency scan & SBOM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Generate SBOM
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json --ignore-npm-errors

      - name: Scan SBOM & repo
        id: trivy
        uses: aquasecurity/trivy-action@0.13.0
        with:
          scan-type: "fs"
          scanners: "vuln"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json 