name: Landing package – build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-landing-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: landing

      - name: Build Next.js landing
        run: pnpm run build
        working-directory: landing

      - name: Archive production build
        run: |
          [ -f ../pnpm-lock.yaml ] && cp ../pnpm-lock.yaml .
          [ -f ../.npmrc ] && cp ../.npmrc .
          tar --ignore-failed-read -czf ../landing.tar.gz \
            .next \
            public \
            next.config.* \
            ecosystem.config.cjs \
            package.json \
            pnpm-lock.yaml \
            .npmrc \
            docs \
            scripts
        working-directory: landing

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: landing.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artefact
        uses: actions/download-artifact@v4
        with:
          name: landing-build

      - name: Ensure remote dirs
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          debug: true
          script: |
            set -e
            mkdir -p /opt/solanaflow/tmp

      - name: Copy build to server (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          debug: true
          source: landing.tar.gz
          target: /opt/solanaflow/tmp/

      - name: Unpack & reload (SSH)
        uses: appleboy/ssh-action@v0.1.7
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          NEXT_PUBLIC_GTAG: ${{ secrets.NEXT_PUBLIC_GTAG }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          debug: true
          script_stop: true
          envs: STAGING_DATABASE_URL,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,ALLOWED_ORIGINS,NEXT_PUBLIC_GTAG,NEXT_PUBLIC_API_URL
          script: |
            set -euxo pipefail
            cd /opt/solanaflow
            if [ -d landing ]; then
              mv landing landing-$(date +%Y%m%d%H%M)
            fi
            mkdir -p landing
            tar -xzf tmp/landing.tar.gz -C landing --strip-components=0
            rm -f tmp/landing.tar.gz
            cat > landing/.env <<EOF
            DATABASE_URL=${STAGING_DATABASE_URL}
            UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
            UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
            ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            NEXT_PUBLIC_GTAG=${NEXT_PUBLIC_GTAG}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            NODE_ENV=staging
            EOF
            cd landing
            pnpm install --prod --no-frozen-lockfile
            pm2 startOrReload ecosystem.config.cjs
            pm2 save
            echo "✅  Landing deployed & PM2 restarted"
