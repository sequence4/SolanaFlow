name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - '**'            # run on every branch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Temporary AWS credentials via OIDC
      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region:     ${{ secrets.AWS_REGION }}

      # 2) Ship and execute commands on the EC2 box
      - name: Send SSM deploy commands
        run: |
          aws ssm send-command \
            --instance-ids  ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --comment       "SolanaFlow CI deploy" \
            --parameters \
            'commands=[
            "cd /home/ec2-user/SolanaFlow",
            "git fetch origin && git checkout main && git reset --hard origin/main",
            "pnpm --filter server build",
            "pm2 restart api || pm2 start dist/index.js --name api",
            "docker pull ghcr.io/hhdgknsn/workspace:latest",
            "for p in $(seq 6000 6004); do docker rm -f ws-$p || true; docker create --name ws-$p -p $p:3000 -v /srv/workspaces:/usr/src/workspace -e WORKSPACE_ID=ws-$p ghcr.io/hhdgknsn/workspace:latest; done",
            "install -m 755 /home/ec2-user/SolanaFlow/server/scripts/reap-ws.sh /usr/local/bin/reap-ws.sh",
            "echo \"* * * * * root /usr/local/bin/reap-ws.sh\" > /etc/cron.d/ws-reaper"
            ]'
