name: Landing package CI

on:
  push:
    paths:
      - 'landing/**'
      - '.github/workflows/landing-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  landing-ci:
    runs-on: ubuntu-latest
    env:
      CI: true
      TZ: UTC
      ACT: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node 20 (GH)
        if: ${{ env.ACT == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Setup Node 20 (act)
        if: ${{ env.ACT != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          node -v
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Type-check landing
        run: pnpm --filter ./landing run type-check

      - name: Lint landing
        run: pnpm --filter ./landing run lint --max-warnings 0

      - name: Test landing
        run: pnpm --filter ./landing run test

      - name: Build landing
        run: pnpm --filter ./landing run build
