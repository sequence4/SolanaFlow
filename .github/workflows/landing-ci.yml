name: Landing package CI

on:
  push:
    paths:
      - 'landing/**'
      - '.github/workflows/landing-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  landing-ci:
    runs-on: ubuntu-latest
    env:
      CI: true
      TZ: UTC
      ACT: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node 20 (GH)
        if: ${{ env.ACT == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Node 20 (act)
        if: ${{ env.ACT != '' }}
        run: |
          corepack enable
          corepack prepare pnpm@10.6.5 --activate
          node -v
          pnpm -v

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Cache Docker layers (postgres:15)
        uses: ScribeMD/docker-cache@0.3.6
        with:
          key: postgres-15

      - name: Type-check landing
        run: pnpm --filter landing run type-check

      - name: Lint landing
        run: pnpm --filter landing run lint --max-warnings 0

      - name: Run API integration tests
        run: pnpm --filter landing test:api
        env:
          NODE_ENV: test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright E2E
        run: pnpm --filter landing test:e2e
        env:
          CI: true
          
      - name: Performance budget (Lighthouse)
        run: pnpm --filter landing lighthouse:test
        
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: landing/.lhci-reports
        
      - name: Unit + smoke tests
        run: pnpm --filter landing test

      - name: Coverage gate
        run: pnpm --filter landing test:cov

      - name: Build landing
        run: pnpm --filter landing run build
